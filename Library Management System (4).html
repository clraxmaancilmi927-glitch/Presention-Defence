<title>Library Management System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--c1:#D4621A;--c2:#FF933E;--c3:#FFCB56;--ink:#1c1208;--top:calc(56px + env(safe-area-inset-top,0px));color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#fff}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink)}
header{position:fixed;top:0;left:0;right:0;height:var(--top);padding:env(safe-area-inset-top,0px) clamp(16px,5vw,64px) 0;background:#fff;display:flex;align-items:center;justify-content:space-between;z-index:10;box-shadow:0 4px 18px rgba(212,98,26,.18)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3))}
.brand{font-weight:800;font-size:clamp(13px,1.4vw,16px);letter-spacing:1px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.num{min-width:54px;text-align:center;padding:3px 14px;border-radius:999px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(212,98,26,.4);transition:transform .3s}
.num:hover{transform:scale(1.08)}
.brand,.num{flex:none}
nav{flex:1;min-width:0;display:flex;gap:6px;margin:0 16px;overflow-x:auto;scrollbar-width:none;padding:6px 2px}
nav::-webkit-scrollbar{display:none}
nav button:first-child{margin-left:auto}
nav button:last-child{margin-right:auto}
nav button{flex:none;font-family:inherit;font-size:11px;font-weight:600;color:#6b4a2e;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;background:linear-gradient(135deg,rgba(212,98,26,.1),rgba(255,203,86,.28));border:1px solid rgba(212,98,26,.18);transition:transform .25s,box-shadow .25s,color .25s,background .25s}
nav button:hover,nav button.act{color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 12px rgba(212,98,26,.35)}
nav button:hover{transform:translateY(-1px)}
.names{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px}
.names b+b::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));margin-right:12px;vertical-align:middle}
#sc{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-padding-top:var(--top);scroll-behavior:smooth;padding-top:var(--top)}
.slide{min-height:calc(100vh - var(--top));min-height:calc(100dvh - var(--top));scroll-snap-align:start;padding:clamp(20px,4vh,48px) clamp(18px,6vw,90px);display:flex;flex-direction:column;justify-content:center}
.slide>*{width:100%;max-width:1040px;margin-left:auto;margin-right:auto}
h1{font-size:clamp(22px,2.8vw,34px);font-weight:700;line-height:1.2;margin-bottom:clamp(16px,3vh,28px);letter-spacing:-.3px;color:var(--ink)}
h1 span{display:inline-block;padding-bottom:5px;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--c1),var(--c2),var(--c3)) 1}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{position:relative;isolation:isolate;overflow:hidden;background:#fff;color:var(--ink);border:1px solid #f3e4d6;font-weight:500;font-size:clamp(13px,1.05vw,15px);line-height:1.6;border-radius:12px;padding:16px 18px 16px 22px;box-shadow:0 4px 14px rgba(212,98,26,.12);opacity:0;transform:translateY(16px);transition:opacity .6s,transform .3s,box-shadow .3s,color .3s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:0;transition:opacity .3s}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--c1),var(--c2),var(--c3))}

.on .card{opacity:1;transform:none;transition-delay:var(--d)}
.on .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(212,98,26,.4);color:#fff;transition-delay:0s}
.card:hover::before{opacity:1}
.card:hover i{color:#fff}
.card i{display:block;font-style:normal;font-weight:700;font-size:13px;margin-bottom:4px;color:var(--c1);transition:color .3s}
.fig{display:flex;justify-content:center}
.ic{display:inline-flex;width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 4px 10px rgba(212,98,26,.3);transition:background .3s}
.ic svg{width:18px;height:18px}
.ic.big{width:56px;height:56px;border-radius:16px}
.ic.big svg{width:28px;height:28px}
.ci{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ci i{margin:0}
.card:hover .ic{background:rgba(255,255,255,.25);box-shadow:none}
.ts{text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px)}
.coll{display:flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(12px,1.2vw,15px);letter-spacing:1.5px}
.pill{padding:5px 16px;border-radius:999px;font-weight:600;font-size:clamp(11px,1vw,13px);letter-spacing:1.5px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px rgba(212,98,26,.35)}
.ts h1{font-size:clamp(28px,5vw,58px);font-weight:800;line-height:1.1;margin:0;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(14px,1.5vw,18px);font-weight:500;color:#5a4a3a}
.by{margin-top:clamp(8px,2vh,20px);padding:18px 32px;border-radius:14px;border:1px solid #f3e4d6;background:#fff;box-shadow:0 6px 20px rgba(212,98,26,.15);display:flex;flex-direction:column;gap:4px;align-items:center}
.by small{font-size:12px;letter-spacing:1px;color:var(--c1);font-weight:700}
.by b{font-size:clamp(16px,1.8vw,22px);font-weight:700}
.by span{font-size:clamp(12px,1.1vw,14px);color:#5a4a3a;display:flex;align-items:center;gap:6px}
.by svg{width:14px;height:14px;color:var(--c1)}
.fig img{max-width:100%;max-height:calc(100dvh - var(--top) - 170px);object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 12px 34px rgba(212,98,26,.3);transition:transform .35s,box-shadow .35s}
.fig img:hover{transform:scale(1.02);box-shadow:0 20px 46px rgba(212,98,26,.45)}
</style>
</head>

{t:"1.1.1 Background of the Library",c:[
"The library was established in 2015 by its founder, Faaiz, and is located in Sh. Nuur Village, Hargeisa.",
"The library provides books and educational materials for students and other readers.",
"It supports learning by providing access to books and organizing library resources.",
"The Library Management System project aims to improve the management of library records, including books, members, authors, categories, and borrowing and returning activities."]},
{t:"Problem Statement",c:[
"Manual record keeping takes a lot of time.",
"Library records may be lost, damaged, or duplicated.",
"Tracking borrowed and available books is difficult.",
"Preparing accurate reports takes time.",
"A computerized system is needed to improve library management."]},
{t:"Proposed Solution",c:[
"Develop a computerized Library Management System.",
"Use C# Windows Forms and Microsoft SQL Server.",
"Manage books, members, authors, categories, employees, and borrowing.",
"Provide secure login for Admin and User.",
"Update book stock automatically.",
"Search records quickly and generate reports."]},
{t:"Goal of the Project",c:[
"To develop a computerized Library Management System.",
"To improve the management of library information.",
"To organize books, members, employees, and borrowing records.",
"To make library activities easier and more efficient.",
"To gain practical experience in database application development."]},
{t:"System Deliverables",c:[
"C# Windows Forms desktop application.",
"Microsoft SQL Server database.",
"Login screen and dashboard.",
"Book, member, author, category, employee, and salary management.",
